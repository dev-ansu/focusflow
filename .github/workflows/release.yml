name: Build and Release FocusFlow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: FocusFlow-Linux.tar.gz
            artifact_file: dist/FocusFlow-Linux.tar.gz
            add_data_sep: ":" # Linux usa dois pontos
            icon_path: "assets/icon.png"
          - os: windows-latest
            asset_name: FocusFlow-Windows.zip
            artifact_file: dist/FocusFlow-Windows.zip
            add_data_sep: ";" # Windows usa ponto e vírgula
            icon_path: "assets/icon.ico"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No Linux, o PySide6 + QtMultimedia exigem bibliotecas do X11 e GStreamer
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pymupdf sqlalchemy

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="${{ matrix.icon_path }}" --add-data="assets${{ matrix.add_data_sep }}assets" --name="FocusFlow" main.py

      # Compacta no Windows
      - name: Zip build artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell Compress-Archive -Path dist/FocusFlow/* -DestinationPath dist/FocusFlow-Windows.zip

      # Compacta no Linux
      - name: Tar build artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf dist/FocusFlow-Linux.tar.gz -C dist/FocusFlow .

      # Faz upload especificamente do arquivo gerado pelo SO da matriz atual
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}