name: Build and Release FocusFlow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            ext: tar.gz
            add_data_sep: ":" # Linux usa dois pontos
            icon_path: "assets/icon.png"
          - os: windows-latest
            os_name: Windows
            ext: zip
            add_data_sep: ";" # Windows usa ponto e vírgula
            icon_path: "assets/icon.ico"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extrai a versão exata da tag do Git (ex: v1.0.7)
      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependências do sistema para interface gráfica e áudio no Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pymupdf sqlalchemy google-api-python-client google-auth-oauthlib python-dotenv

      # Cria e injeta o arquivo de configuração de forma limpa e segura
      - name: Inject Secrets and Version into App
        shell: bash
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p config
          python -c "
          import os

          client_id = os.environ.get('GDRIVE_CLIENT_ID', '')
          client_secret = os.environ.get('GDRIVE_CLIENT_SECRET', '')
          app_version = os.environ.get('APP_VERSION', '1.0.0')

          content = f'''import os

          os.environ[\"GDRIVE_CLIENT_ID\"] = \"{client_id}\"
          os.environ[\"GDRIVE_CLIENT_SECRET\"] = \"{client_secret}\"
          os.environ[\"APP_VERSION\"] = \"{app_version}\"
          '''

          with open('config/release_config.py', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # Compilação com PyInstaller registrando o modulo release_config e a pasta config
      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --hidden-import="googleapiclient.discovery" \
            --hidden-import="google_auth_oauthlib.flow" \
            --hidden-import="config.release_config" \
            --icon="${{ matrix.icon_path }}" \
            --add-data="assets${{ matrix.add_data_sep }}assets" \
            --add-data="config${{ matrix.add_data_sep }}config" \
            --name="FocusFlow-${{ steps.get_version.outputs.VERSION }}" main.py

      # Compacta no Windows gerando FocusFlow-Windows.zip (combina com o link do README)
      - name: Zip build artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell Compress-Archive -Path dist/FocusFlow-${{ steps.get_version.outputs.VERSION }}/* -DestinationPath dist/FocusFlow-Windows.zip

      # Compacta no Linux gerando FocusFlow-Linux.tar.gz (combina com o link do README)
      - name: Tar build artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf dist/FocusFlow-Linux.tar.gz -C dist/FocusFlow-${{ steps.get_version.outputs.VERSION }} .

      # Publica os arquivos na Release do GitHub
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FocusFlow-${{ matrix.os_name }}.${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}