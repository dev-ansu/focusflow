name: Build and Release FocusFlow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            ext: tar.gz
            add_data_sep: ":" # Linux usa dois pontos
            icon_path: "assets/icon.png"
          - os: windows-latest
            os_name: Windows
            ext: zip
            add_data_sep: ";" # Windows usa ponto e vírgula
            icon_path: "assets/icon.ico"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extrai a versão exata da tag do Git (ex: v1.0.7)
      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependências do sistema para interface gráfica e áudio no Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pymupdf sqlalchemy google-api-python-client google-auth-oauthlib python-dotenv

      # Cria e injeta o arquivo de configuração usando Base64 (sem texto puro no bytecode)
      - name: Inject Secrets and Version into App
        shell: bash
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p config
          python -c "
          import os, base64

          raw_id = os.environ.get('GDRIVE_CLIENT_ID', '')
          raw_secret = os.environ.get('GDRIVE_CLIENT_SECRET', '')
          app_version = os.environ.get('APP_VERSION', '1.0.0')

          b64_id = base64.b64encode(raw_id.encode()).decode()
          b64_secret = base64.b64encode(raw_secret.encode()).decode()

          content = f'''import os, base64

          os.environ[\"GDRIVE_CLIENT_ID\"] = base64.b64decode(\"{b64_id}\").decode()
          os.environ[\"GDRIVE_CLIENT_SECRET\"] = base64.b64decode(\"{b64_secret}\").decode()
          os.environ[\"APP_VERSION\"] = \"{app_version}\"
          '''

          with open('config/release_config.py', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # Compilação com PyInstaller (sem expor a pasta config)
      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --hidden-import="googleapiclient.discovery" \
            --hidden-import="google_auth_oauthlib.flow" \
            --hidden-import="config.release_config" \
            --icon="${{ matrix.icon_path }}" \
            --add-data="assets${{ matrix.add_data_sep }}assets" \
            --name="FocusFlow-${{ steps.get_version.outputs.VERSION }}" main.py

      # Compacta no Windows gerando FocusFlow-Windows.zip
      - name: Zip build artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell Compress-Archive -Path dist/FocusFlow-${{ steps.get_version.outputs.VERSION }}/* -DestinationPath dist/FocusFlow-Windows.zip

      # Compacta no Linux garantindo o atalho .desktop com suporte a ícones dinâmicos e permissão de execução (+x)
      # Compacta no Linux deixando apenas o .desktop na raiz e o restante no _internal
      # Compacta no Linux com o executável e o .desktop na raiz, e o script em _internal
      - name: Tar build artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          APP_DIR="dist/FocusFlow-${{ steps.get_version.outputs.VERSION }}"
          EXEC_NAME="FocusFlow-${{ steps.get_version.outputs.VERSION }}"
          
          # 1. Permissão de execução no executável principal (na raiz)
          chmod +x "$APP_DIR/$EXEC_NAME"

          # 2. Script inicializador dentro de _internal
          cat <<EOF > "$APP_DIR/_internal/FocusFlow.sh"
          #!/usr/bin/env bash
          INTERNAL_DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
          BASE_DIR="\$(dirname "\$INTERNAL_DIR")"
          
          # Copia o ícone para a pasta de ícones do sistema do usuário
          mkdir -p "\$HOME/.local/share/icons"
          cp "\$INTERNAL_DIR/assets/icon.png" "\$HOME/.local/share/icons/focusflow-app.png" 2>/dev/null || true
          
          # Conteúdo padrão do arquivo .desktop
          DESKTOP_CONTENT="[Desktop Entry]
          Version=1.0
          Type=Application
          Name=FocusFlow
          Name[pt_BR]=FocusFlow
          Comment=Gerenciador de Ciclos de Estudos e Leitor de PDF
          Exec=\"\$INTERNAL_DIR/FocusFlow.sh\"
          Icon=focusflow-app
          Terminal=false
          Categories=Utility;Education;
          Path=\$BASE_DIR"

          # A) Adiciona ao Menu de Aplicativos do sistema
          mkdir -p "\$HOME/.local/share/applications"
          echo "\$DESKTOP_CONTENT" > "\$HOME/.local/share/applications/FocusFlow.desktop"
          chmod +x "\$HOME/.local/share/applications/FocusFlow.desktop"

          # B) Descobre a pasta da Área de Trabalho (suporta português/inglês)
          DESKTOP_DIR="\$(xdg-user-dir DESKTOP 2>/dev/null || echo "\$HOME/Área de Trabalho")"
          if [ ! -d "\$DESKTOP_DIR" ]; then
              DESKTOP_DIR="\$HOME/Desktop"
          fi

          # C) Cria o atalho direto na Área de Trabalho do usuário
          if [ -d "\$DESKTOP_DIR" ]; then
              SHORTCUT="\$DESKTOP_DIR/FocusFlow.desktop"
              echo "\$DESKTOP_CONTENT" > "\$SHORTCUT"
              chmod +x "\$SHORTCUT"
              gio set "\$SHORTCUT" metadata::trusted true 2>/dev/null || true
          fi

          # Executa o aplicativo
          cd "\$BASE_DIR"
          exec "\$BASE_DIR/$EXEC_NAME" "\$@"
          EOF

          chmod +x "$APP_DIR/_internal/FocusFlow.sh"

          # 3. Lançador .desktop na raiz da pasta extraída
          cat <<EOF > "$APP_DIR/FocusFlow.desktop"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=FocusFlow
          Name[pt_BR]=FocusFlow
          Comment=Gerenciador de Ciclos de Estudos e Leitor de PDF
          Exec=sh -c '"\$(dirname "%k")/_internal/FocusFlow.sh"'
          Icon=focusflow-app
          Terminal=false
          Categories=Utility;Education;
          EOF

          chmod +x "$APP_DIR/FocusFlow.desktop"

          # 4. Compacta a pasta
          tar -czvf dist/FocusFlow-Linux.tar.gz -C dist "FocusFlow-${{ steps.get_version.outputs.VERSION }}"

      # Publica os arquivos na Release do GitHub
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FocusFlow-${{ matrix.os_name }}.${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}